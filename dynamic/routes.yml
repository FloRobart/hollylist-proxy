# Everything Traefik exposes: a service that is not listed here cannot be reached from outside.
#
# Traefik reaches each service by its name, on the network of that service. The
# docker-compose.override.yml of hollylist-wrapper connects Traefik to these networks.
#
# HTTPS, the certificate, the security headers and the rate limit come from the "websecure"
# entrypoint. A "tls" key must not be added to a router: Traefik would serve its default
# certificate instead of the Let's Encrypt one.

http:
  routers:
    hollylist-api:
      rule: "Host(`api.hollylist.florobart.fr`)"
      entryPoints:
        - websecure
      service: hollylist-api

    hollylist-app:
      rule: "Host(`hollylist.florobart.fr`)"
      entryPoints:
        - websecure
      service: hollylist-app

  services:
    hollylist-api:
      loadBalancer:
        servers:
          - url: "http://hollylist-api:80"
        healthCheck:
          path: /
          interval: 10s
          timeout: 5s

    hollylist-app:
      loadBalancer:
        servers:
          - url: "http://hollylist-app:8080"
        healthCheck:
          path: /
          interval: 10s
          timeout: 5s
